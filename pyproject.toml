[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steamlan"
version = "0.1.0"
description = "Create a virtual LAN with your Steam friends."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
